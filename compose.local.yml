# Prod-parity local stack.
#
# Runs the same images, the same nginx, and the same single-origin routing as
# production, so it doubles as the test harness for the deployment setup: if
# the /api proxy or the seed path is broken, it breaks here rather than on a
# server.
#
#   Build from your working tree:   docker compose -f compose.local.yml up -d --build
#   Run a published build:          API_TAG=<sha> WEB_TAG=<sha> LEARNER_TAG=<sha> WRITER_TAG=<sha> HOMEPAGE_TAG=<sha> \
#                                     API_IMAGE=ghcr.io/mroshan74/qbank-api \
#                                     WEB_IMAGE=ghcr.io/mroshan74/qbank-admin \
#                                     LEARNER_IMAGE=ghcr.io/mroshan74/qbank-learner \
#                                     WRITER_IMAGE=ghcr.io/mroshan74/qbank-writer \
#                                     HOMEPAGE_IMAGE=ghcr.io/mroshan74/qbank-homepage \
#                                     docker compose -f compose.local.yml pull && ... up -d --no-build
#   First-run bootstrap:            docker compose -f compose.local.yml --profile seed run --rm seed
#
# Then open  http://localhost:8080 (admin),  http://localhost:8081 (learner),
# http://localhost:8082 (writer)  and  http://localhost:8083 (homepage)
#
# The web, learner and writer containers are the only place each SPA's /api
# proxy and its PDF fonts under /fonts/ get exercised before a server sees them
# — `pnpm dev` is cross-origin to :5000 (or proxies through Vite) and loads
# fonts off the dev server, so neither path is covered there. Check both here
# after touching any app's nginx.conf.
#
# This stack deliberately uses its OWN MongoDB container. The predecessor
# project's local compose pointed at the live Atlas cluster with full
# read/write — a demo stack must not be able to damage real data.

name: qbank-local

x-api-env: &api-env
  MONGODB_URI: mongodb://mongo:27017/qbank
  JWT_SECRET: local-only-not-a-real-secret
  PORT: "5000"
  NODE_ENV: production
  # Every frontend. Setting this REPLACES the API's fallback list rather than
  # extending it, so every origin has to be named here. (Each SPA is
  # same-origin behind its own nginx, so CORS never actually fires here; the
  # list is kept complete so it stays true if that ever changes.) The homepage
  # (:8083) makes no API call and is deliberately absent.
  CLIENT_URL: http://localhost:8080,http://localhost:8081,http://localhost:8082
  BUILD_ID: ${BUILD_VERSION:-local}
  # Kept on locally — it is the quickest way to poke at the API by hand.
  SWAGGER_ENABLED: "true"
  # Off by default so a demo stack never spends OpenAI credits.
  AI_TAGGING_QUEUE_ENABLED: "false"
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # Consumer sign-in. Defaults to the console sender so this stack costs nothing
  # to run, but note NODE_ENV=production above: the console sender withholds the
  # code from the response, so signing in at :8081 means reading it out of
  # `docker compose logs api`. To exercise real SMS, put OTP_PROVIDER and the
  # three MESSAGE_CENTRAL_* values in a .env beside this file.
  OTP_PROVIDER: ${OTP_PROVIDER:-console}
  MESSAGE_CENTRAL_CUSTOMER_ID: ${MESSAGE_CENTRAL_CUSTOMER_ID:-}
  # The account password, base64-encoded. The raw password is rejected.
  MESSAGE_CENTRAL_KEY: ${MESSAGE_CENTRAL_KEY:-}
  MESSAGE_CENTRAL_EMAIL: ${MESSAGE_CENTRAL_EMAIL:-}
  # Telegram (qbank-api decision 0063). Empty by default, which leaves the
  # whole module inert: no update loop starts and /api/telegram/* answers 503.
  # To use it, put the DEV bot's token in a .env beside this file. Never the
  # production bot's: two processes polling one bot knock each other out (409).
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  # Only for pointing the API at a stand-in or a self-hosted Bot API server.
  TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
  # The learner site the bot puts behind the button under a post. Telegram
  # refuses a localhost address in a button, so a post made from this stack
  # needs a real https host here to carry one.
  LEARNER_APP_URL: ${LEARNER_APP_URL:-http://localhost:8081}
  # Whether the bot opens the learner app INSIDE Telegram, as the Mini App
  # (qbank-api decision 0064, D10): its menu button, the button under its
  # welcome, and a post's button, which then leads to t.me/<bot>?startapp=...
  # Off by default. Needs a real https LEARNER_APP_URL (a tunnel to :8081)
  # and, for a post's button, the bot's Main Mini App set in BotFather.
  TELEGRAM_MINI_APP_ENABLED: ${TELEGRAM_MINI_APP_ENABLED:-false}
  # The most learner attempts written to the database a second (qbank-api
  # decision 0066). Here so the load test can be run with other values.
  ATTEMPT_WRITES_PER_SECOND: ${ATTEMPT_WRITES_PER_SECOND:-60}
  # The least time between two new-lead messages about one channel. Here only
  # so a local check can shorten it; a server leaves it at a minute.
  TELEGRAM_LEAD_ALERT_GAP_MS: ${TELEGRAM_LEAD_ALERT_GAP_MS:-60000}
  # Sign in with Telegram (qbank-api decision 0063, D13). Empty by default,
  # which leaves the learner app's Continue with Telegram button off. The two
  # values come from BotFather (Login Widget), which must also list
  # http://localhost:8081/login/telegram as an allowed redirect address.
  TELEGRAM_LOGIN_CLIENT_ID: ${TELEGRAM_LOGIN_CLIENT_ID:-}
  TELEGRAM_LOGIN_CLIENT_SECRET: ${TELEGRAM_LOGIN_CLIENT_SECRET:-}
  # Only for a stand-in login server: the address the browser is sent to, and
  # where this container reaches the same server.
  TELEGRAM_LOGIN_ISSUER: ${TELEGRAM_LOGIN_ISSUER:-https://oauth.telegram.org}
  TELEGRAM_LOGIN_INTERNAL_URL: ${TELEGRAM_LOGIN_INTERNAL_URL:-}
  SEEDER_DATA_DIR: data
  SEED_SUPERADMIN_USERNAME: ${SEED_SUPERADMIN_USERNAME:-superadmin}
  SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-ChangeMe123!}

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    # 27018 on the host so this never collides with a MongoDB you already run
    # on the default port. Connect a GUI to mongodb://localhost:27018.
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    image: ${API_IMAGE:-qbank-api}:${API_TAG:-local}
    build:
      context: ../qbank-api
      args:
        BUILD_VERSION: ${BUILD_VERSION:-local}
    restart: unless-stopped
    environment: *api-env
    # No published port: the web container reaches it over the compose network,
    # exactly as Traefik + nginx do in production.
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ai_tagging_jobs:/app/data/jobs/ai-tagging
    # Same probes as compose.prod.yml — this stack only earns its keep if a
    # healthcheck that would fail on the server fails here first.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/api/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    image: ${WEB_IMAGE:-qbank-admin}:${WEB_TAG:-local}
    build:
      context: ../qbank-admin
      args:
        BUILD_VERSION: ${BUILD_VERSION:-local}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  learner:
    image: ${LEARNER_IMAGE:-qbank-learner}:${LEARNER_TAG:-local}
    build:
      context: ../qbank-learner
      args:
        BUILD_VERSION: ${BUILD_VERSION:-local}
    restart: unless-stopped
    ports:
      - "${LEARNER_PORT:-8081}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # The question writer portal (qbank-writer). Same shape as the learner tier:
  # its own nginx, single-origin /api, its own Malayalam fonts under /fonts/.
  writer:
    image: ${WRITER_IMAGE:-qbank-writer}:${WRITER_TAG:-local}
    build:
      context: ../qbank-writer
      args:
        BUILD_VERSION: ${BUILD_VERSION:-local}
    restart: unless-stopped
    ports:
      - "${WRITER_PORT:-8082}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # The marketing site (qbank-homepage). Static: no /api proxy, no dependency
  # on the api, probed at its own /healthz.
  homepage:
    image: ${HOMEPAGE_IMAGE:-qbank-homepage}:${HOMEPAGE_TAG:-local}
    build:
      context: ../qbank-homepage
      args:
        BUILD_VERSION: ${BUILD_VERSION:-local}
    restart: unless-stopped
    ports:
      - "${HOMEPAGE_PORT:-8083}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # One-shot bootstrap: System organization + superadmin, taxonomy, then the
  # bundled papers and questions. Idempotent, safe to re-run.
  seed:
    profiles: [seed]
    image: ${API_IMAGE:-qbank-api}:${API_TAG:-local}
    environment:
      <<: *api-env
      API_BASE_URL: http://api:5000
      ADMIN_URL: http://localhost:${WEB_PORT:-8080}
    volumes:
      - ./scripts/bootstrap.mjs:/bootstrap.mjs:ro
    command: ["node", "/bootstrap.mjs"]
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  ai_tagging_jobs:
